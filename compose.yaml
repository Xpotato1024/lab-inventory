services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${LAB_INVENTORY_PORT:-8000}:8000"
    volumes:
      - ${LAB_INVENTORY_HOST_DATA_DIR:-./var/data}:/data
      - ${LAB_INVENTORY_HOST_BACKUP_DIR:-./var/backups}:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
