{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab Inventory{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'inventory/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'inventory:home' %}">Lab Inventory</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="link-button" type="submit">ログアウト</button>
      </form>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
