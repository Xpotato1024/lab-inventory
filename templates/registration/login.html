{% extends "base.html" %}

{% block title %}ログイン | Lab Inventory{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>ログイン</h1>
  {% if form.errors %}
    <p class="error">ユーザー名またはパスワードを確認してください。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
  </form>
</section>
{% endblock %}
