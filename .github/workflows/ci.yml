name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      LAB_INVENTORY_DB: ${{ github.workspace }}/var/data/ci.sqlite3
      LAB_INVENTORY_BACKUP_DIR: ${{ github.workspace }}/var/backups
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p var/data var/backups

      - name: Check shell script syntax
        run: sh -n scripts/*.sh

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run --verbosity 3

      - name: Run migrations and configure SQLite
        run: |
          python manage.py migrate --noinput
          python manage.py configure_sqlite

      - name: Run Django checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Exercise backup and verification
        run: |
          python manage.py backup_db --output var/backups/ci.sqlite3
          python manage.py verify_db var/backups/ci.sqlite3

      - name: Build container image
        run: docker build -t lab-inventory:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production-like environment
        run: |
          mkdir -p var/data var/backups var/offsite
          cp .env.production.example .env
          sed -i 's#^DJANGO_SECRET_KEY=.*#DJANGO_SECRET_KEY=ci-compose-only-secret-key-not-for-production#' .env
          sed -i 's#^DJANGO_ALLOWED_HOSTS=.*#DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1#' .env
          sed -i 's#^DJANGO_CSRF_TRUSTED_ORIGINS=.*#DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost#' .env
          sed -i "s#^LAB_INVENTORY_HOST_DATA_DIR=.*#LAB_INVENTORY_HOST_DATA_DIR=${GITHUB_WORKSPACE}/var/data#" .env
          sed -i "s#^LAB_INVENTORY_HOST_BACKUP_DIR=.*#LAB_INVENTORY_HOST_BACKUP_DIR=${GITHUB_WORKSPACE}/var/backups#" .env
          sed -i "s#^LAB_INVENTORY_OFFSITE_BACKUP_DIR=.*#LAB_INVENTORY_OFFSITE_BACKUP_DIR=${GITHUB_WORKSPACE}/var/offsite#" .env

      - name: Run deployment preflight
        run: sh scripts/preflight.sh

      - name: Start workstation stack
        run: docker compose up -d --build --wait

      - name: Check health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/healthz/

      - name: Exercise verified off-workstation mirror
        run: |
          sh scripts/backup-mirror.sh
          test -n "$(find var/offsite -maxdepth 1 -type f -name 'lab-inventory-*.sqlite3' -print -quit)"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
